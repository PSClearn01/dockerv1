---
services:
  checkmk:
    image: checkmk/check-mk-community:2.5.0-latest
    restart: unless-stopped
    environment:
      - TZ=US/Pacific
      - CMK_PASSWORD=${CMK_PASSWORD}
      - CMK_SITE_ID=psccmk
    tmpfs:
      - /opt/omd/sites/psccmk/tmp:uid=1000,gid=1000
    volumes:
      - checkmk_data:/omd/sites:rw
    networks:
      traefik_proxy:
    ports:
      - "8000:8000"
      - "162:162/udp"
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_proxy
      - traefik.http.services.checkmk-web.loadBalancer.server.port=5000
      - traefik.http.services.checkmk-web.loadBalancer.server.scheme=http
      - traefik.http.routers.checkmk-http.service=checkmk-web
      - traefik.http.routers.checkmk-http.rule=Host(`checkmk.devpurosurccd.com`)
      - traefik.http.routers.checkmk-http.entrypoints=web-internal
      - traefik.http.routers.checkmk-https.service=checkmk-web
      - traefik.http.routers.checkmk-https.rule=Host(`checkmk.devpurosurccd.com`)
      - traefik.http.routers.checkmk-https.entrypoints=websecure-internal
      - traefik.http.routers.checkmk-https.tls=true
      - traefik.http.routers.checkmk-https.tls.certresolver=cloudflare

volumes:
  checkmk_data:
    driver: local
networks:
  traefik_proxy:
    external: true
