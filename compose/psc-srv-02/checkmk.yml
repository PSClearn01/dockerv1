services:
  checkmk:
    image: "checkmk/check-mk-community:2.5.0-latest"
    container_name: "checkmk"
    environment:
      - CMK_PASSWORD=EpUj2zi54QZ8GpCYVw49QbfRxFOhNAxx
      - TZ=US/Pacific
      - CMK_SITE_ID=psccmk
    volumes:
      - monitoring:/omd/sites
    tmpfs:
      - /opt/omd/sites/cmk/tmp:uid=1000,gid=1000
    ports:
      - 8082:5000
      - 8000:8000
    restart: always

volumes:
  monitoring: